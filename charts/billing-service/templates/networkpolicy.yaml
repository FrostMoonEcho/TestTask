{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "billing-service.fullname" . }}
  labels:
    {{- include "billing-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "billing-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Both selectors are in the same list item: only API gateway pods in the
    # named namespace match, rather than either condition matching alone.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.apiGateway.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.apiGateway.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
{{- end }}
